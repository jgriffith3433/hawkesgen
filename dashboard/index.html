<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hawkes Gen</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="favicon.svg" alt=""><div><b>Hawkes Gen</b><span>Generative R&amp;D for every Hawkes product</span></div></div>
    <nav id="tabs">
      <button data-tab="overview" class="on">Overview</button>
      <button data-tab="jobs">Jobs</button>
      <button data-tab="entities">Entities</button>
      <button data-tab="library">Library</button>
      <button data-tab="playtests">Playtests</button>
      <button data-tab="fleet">GPU fleet</button>
      <button data-tab="machines">Machines</button>
      <button data-tab="tools">Tools</button>
      <button data-tab="presets">Presets</button>
      <button data-tab="workflows">Workflows</button>
      <button data-tab="accounts">Accounts</button>
      <button data-tab="ai">AI</button>
      <button data-tab="usage">Usage</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div id="live" class="pill">connecting…</div>
  </header>
  <main>
    <section id="overview" class="tab on"></section>
    <section id="jobs" class="tab"></section>
    <section id="entities" class="tab"></section>
    <section id="library" class="tab"></section>
    <section id="playtests" class="tab"></section>
    <section id="fleet" class="tab"></section>
    <section id="machines" class="tab"></section>
    <section id="tools" class="tab"></section>
    <section id="presets" class="tab"></section>
    <section id="workflows" class="tab"></section>
    <section id="accounts" class="tab"></section>
    <section id="ai" class="tab"></section>
    <section id="usage" class="tab"></section>
    <section id="settings" class="tab"></section>
  </main>
  <dialog id="modal"><div id="modalBody"></div></dialog>
  <div id="toast"></div>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
