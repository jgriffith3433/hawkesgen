<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Player - Hawkes Play</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
    }
    #gameContainer {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #loadingScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 1000;
    }
    #loadingScreen.hidden {
      display: none;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #errorScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      color: #ff6b6b;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      z-index: 1001;
    }
    #errorScreen.show {
      display: flex;
    }
    #errorScreen h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }
    #errorScreen pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      text-align: left;
      overflow: auto;
      max-height: 400px;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/cannon.js"></script>
</head>
<body>
  <div id="gameContainer">
    <div id="loadingScreen">
      <div class="spinner"></div>
      <div id="loadingText">Loading game...</div>
    </div>
    <div id="errorScreen">
      <h2>⚠️ Game Error</h2>
      <pre id="errorMessage"></pre>
    </div>
  </div>

  <script type="module">
    // Get game ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game');
    const subdomain = urlParams.get('subdomain');
    const releaseId = urlParams.get('release');

    const loadingText = document.getElementById('loadingText');
    const loadingScreen = document.getElementById('loadingScreen');
    const errorScreen = document.getElementById('errorScreen');
    const errorMessage = document.getElementById('errorMessage');

    function showError(message) {
      errorMessage.textContent = message;
      errorScreen.classList.add('show');
      loadingScreen.classList.add('hidden');
    }

    async function loadGame() {
      try {
        // Determine which endpoint to use
        let gameData;
        if (subdomain) {
          // Load published game by subdomain
          const res = await fetch(`/v1/play/${subdomain}`);
          if (!res.ok) throw new Error('Game not found');
          gameData = await res.json();
        } else if (gameId) {
          // Load game in development mode
          const res = await fetch(`/v1/games/${gameId}`);
          if (!res.ok) throw new Error('Game not found');
          gameData = await res.json();

          // Load files
          const filesRes = await fetch(`/v1/games/${gameId}/files`);
          if (!filesRes.ok) throw new Error('Failed to load game files');
          const filesData = await filesRes.json();
          gameData.files = filesData.files;
        } else if (releaseId) {
          // Load specific release
          const res = await fetch(`/v1/releases/${releaseId}`);
          if (!res.ok) throw new Error('Release not found');
          gameData = await res.json();
        } else {
          throw new Error('No game identifier provided');
        }

        loadingText.textContent = 'Preparing game...';

        // Find the HTML entry point
        const htmlFile = gameData.files?.find(f => f.path === 'index.html');
        if (!htmlFile) {
          throw new Error('No index.html found in game files');
        }

        // Parse HTML and inject it
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlFile.content, 'text/html');

        // Transfer head content
        const headElements = doc.head.querySelectorAll('style, link, meta');
        headElements.forEach(el => {
          if (el.tagName === 'META' && el.getAttribute('charset')) return; // Skip charset
          if (el.tagName === 'META' && el.getAttribute('name') === 'viewport') return; // Skip viewport
          document.head.appendChild(el.cloneNode(true));
        });

        // Transfer body content
        const bodyContent = doc.body.innerHTML;
        document.getElementById('gameContainer').insertAdjacentHTML('beforeend', bodyContent);

        // Load and execute JavaScript files
        const jsFiles = gameData.files?.filter(f => f.path.endsWith('.js'));
        for (const file of jsFiles || []) {
          // Create blob URL for the script
          const blob = new Blob([file.content], { type: 'application/javascript' });
          const blobUrl = URL.createObjectURL(blob);

          if (file.path === 'game.js' && file.content.includes('import')) {
            // Module script
            const script = document.createElement('script');
            script.type = 'module';
            script.src = blobUrl;
            document.body.appendChild(script);
          } else {
            // Regular script
            const script = document.createElement('script');
            script.src = blobUrl;
            document.body.appendChild(script);
          }
        }

        // Hide loading screen
        setTimeout(() => {
          loadingScreen.classList.add('hidden');
        }, 500);

      } catch (error) {
        console.error('Failed to load game:', error);
        showError(error.message || 'Unknown error occurred');
      }
    }

    // Global error handler
    window.addEventListener('error', (event) => {
      showError(`Runtime Error:\n\n${event.error?.stack || event.message}`);
    });

    window.addEventListener('unhandledrejection', (event) => {
      showError(`Unhandled Promise Rejection:\n\n${event.reason?.stack || event.reason}`);
    });

    // Start loading
    loadGame();
  </script>
</body>
</html>
