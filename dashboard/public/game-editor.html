<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script src="/gen/nozoom.js"></script>
  <title>Hawkes Play — Game Builder</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/public/public.css">
  <script src="/sdk/analytics@1.js" data-project="hawkesgen" defer></script>
  <style>
    :root {
      --editor-bg: #1e1e1e;
      --sidebar-width: 250px;
      --preview-width: 40%;
    }

    body { margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    .auth-screen {
      display: none;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px 20px;
    }
    .auth-screen.show { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .auth-card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .auth-card h1 { margin: 0 0 8px; font-size: 28px; color: #1a1a2e; }
    .auth-card p { margin: 0 0 24px; color: #666; }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .auth-tab { flex: 1; padding: 10px; border: none; background: #f0f0f0; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .auth-tab.active { background: #667eea; color: white; }
    .form-field { margin-bottom: 16px; }
    .form-field label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .btn-primary { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 16px; }
    .btn-primary:hover { background: #5568d3; }
    .error-msg { color: #e74c3c; font-size: 14px; margin-bottom: 12px; display: none; }
    .error-msg.show { display: block; }

    /* Main Layout */
    .app-container { display: none; height: 100vh; flex-direction: column; }
    .app-container.show { display: flex; }

    .top-bar {
      height: 56px;
      background: #2d3748;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #1a202c;
    }
    .top-bar-left { display: flex; align-items: center; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; text-decoration: none; color: white; }
    .logo img { width: 28px; height: 28px; }
    .game-name { font-size: 16px; font-weight: 500; color: #a0aec0; }
    .top-bar-right { display: flex; align-items: center; gap: 12px; }
    .credits-badge { background: #4a5568; padding: 6px 12px; border-radius: 6px; font-size: 14px; }
    .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; font-size: 14px; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-secondary { background: #4a5568; color: white; }
    .btn-secondary:hover { background: #2d3748; }
    .btn-success { background: #48bb78; color: white; }
    .btn-success:hover { background: #38a169; }
    .btn-ghost { background: transparent; color: #a0aec0; }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }

    /* Games List View */
    .games-view { display: none; padding: 40px; background: #f7fafc; min-height: calc(100vh - 56px); overflow-y: auto; }
    .games-view.show { display: block; }
    .games-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .games-header h1 { margin: 0; font-size: 32px; color: #1a202c; }
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .game-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 2px solid transparent;
    }
    .game-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); border-color: #667eea; }
    .game-card h3 { margin: 0 0 8px; font-size: 20px; color: #1a202c; }
    .game-card p { margin: 0 0 16px; color: #718096; font-size: 14px; }
    .game-card-footer { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #a0aec0; }
    .new-game-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      border: 2px dashed rgba(255,255,255,0.5);
    }
    .new-game-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(102,126,234,0.3); border-color: white; }
    .new-game-card .icon { font-size: 48px; margin-bottom: 12px; }
    .new-game-card h3 { color: white; margin: 0; }

    /* Editor View */
    .editor-view { display: none; flex: 1; overflow: hidden; }
    .editor-view.show { display: flex; }
    .editor-layout { display: flex; flex: 1; overflow: hidden; }

    /* File Tree */
    .file-tree {
      width: var(--sidebar-width);
      background: #252526;
      color: #cccccc;
      overflow-y: auto;
      border-right: 1px solid #1e1e1e;
    }
    .file-tree-header {
      padding: 12px 16px;
      background: #2d2d30;
      border-bottom: 1px solid #1e1e1e;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .file-tree-item {
      padding: 6px 16px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 2px solid transparent;
    }
    .file-tree-item:hover { background: #2a2d2e; }
    .file-tree-item.active { background: #37373d; border-left-color: #667eea; color: white; }
    .file-icon { opacity: 0.7; font-size: 12px; }

    /* Code Editor */
    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--editor-bg);
      overflow: hidden;
    }
    .editor-tabs {
      display: flex;
      align-items: center;
      background: #252526;
      border-bottom: 1px solid #1e1e1e;
      overflow-x: auto;
    }
    .editor-tab {
      padding: 10px 20px;
      background: #2d2d30;
      color: #cccccc;
      border: none;
      border-right: 1px solid #1e1e1e;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .editor-tab.active { background: var(--editor-bg); color: white; }
    .editor-tab:hover { background: #37373d; }
    .editor-tab .close { margin-left: 8px; opacity: 0.5; }
    .editor-tab .close:hover { opacity: 1; }
    #monacoEditor { flex: 1; height: 100%; }

    /* Preview */
    .preview-pane {
      width: var(--preview-width);
      background: #1e1e1e;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    .preview-header {
      padding: 12px 16px;
      background: #252526;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .preview-header h3 { margin: 0; font-size: 13px; color: #cccccc; font-weight: 600; text-transform: uppercase; }
    .preview-iframe { flex: 1; border: none; background: white; }

    /* Bottom Panel (AI Assistant) */
    .bottom-panel {
      height: 300px;
      background: #252526;
      border-top: 1px solid #1e1e1e;
      display: none;
      flex-direction: column;
    }
    .bottom-panel.show { display: flex; }
    .panel-header {
      padding: 12px 16px;
      background: #2d2d30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e1e1e;
    }
    .panel-header h3 { margin: 0; font-size: 13px; color: #cccccc; font-weight: 600; text-transform: uppercase; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-message {
      padding: 12px;
      border-radius: 8px;
      max-width: 80%;
    }
    .chat-message.user {
      background: #667eea;
      color: white;
      align-self: flex-end;
    }
    .chat-message.assistant {
      background: #2d2d30;
      color: #cccccc;
      align-self: flex-start;
    }
    .chat-input-wrapper {
      padding: 12px 16px;
      background: #1e1e1e;
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
    }
    .chat-input {
      flex: 1;
      padding: 10px 12px;
      background: #2d2d30;
      border: 1px solid #3e3e42;
      border-radius: 6px;
      color: white;
      font-size: 14px;
    }
    .chat-input:focus { outline: none; border-color: #667eea; }

    /* Modals */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: white;
      border-radius: 12px;
      padding: 32px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h2 { margin: 0 0 24px; font-size: 24px; color: #1a202c; }
    .template-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .template-card {
      padding: 20px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .template-card:hover { border-color: #667eea; background: #f7fafc; }
    .template-card.selected { border-color: #667eea; background: #edf2f7; }
    .template-card h4 { margin: 0 0 8px; font-size: 16px; color: #1a202c; }
    .template-card p { margin: 0; font-size: 13px; color: #718096; }
  </style>
</head>
<body>
  <!-- Auth Screen -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <h1>Welcome to Hawkes Play</h1>
      <p>Build web games collaboratively with AI</p>
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">Sign In</button>
        <button class="auth-tab" data-mode="signup">Sign Up</button>
      </div>
      <form id="authForm">
        <div class="form-field" id="nameField" style="display: none;">
          <label>Name</label>
          <input type="text" class="form-input" id="authName" placeholder="Your Name">
        </div>
        <div class="form-field">
          <label>Email</label>
          <input type="email" class="form-input" id="authEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-field">
          <label>Password</label>
          <input type="password" class="form-input" id="authPassword" placeholder="••••••••" minlength="6" required>
        </div>
        <div class="error-msg" id="authError"></div>
        <button type="submit" class="btn-primary" id="authSubmit">Continue</button>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div class="app-container" id="appContainer">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="top-bar-left">
        <a href="/home" class="logo">
          <img src="/favicon.svg" alt="Hawkes Play">
          <span>Hawkes Play</span>
        </a>
        <span class="game-name" id="topBarGameName"></span>
      </div>
      <div class="top-bar-right">
        <span class="credits-badge" id="creditsDisplay">⚡ 0 Credits</span>
        <button class="btn btn-sm btn-secondary" id="buyCreditsBtn">+ Buy Credits</button>
        <span id="userEmail" style="color: #a0aec0; font-size: 14px;"></span>
        <button class="btn btn-sm btn-ghost" id="logoutBtn">Sign Out</button>
      </div>
    </div>

    <!-- Games List View -->
    <div class="games-view show" id="gamesView">
      <div class="games-header">
        <h1>My Games</h1>
        <button class="btn btn-success" id="newGameBtn">+ New Game</button>
      </div>
      <div class="games-grid" id="gamesGrid">
        <!-- Games will be loaded here -->
      </div>
    </div>

    <!-- Editor View -->
    <div class="editor-view" id="editorView">
      <div class="editor-layout">
        <!-- File Tree -->
        <div class="file-tree">
          <div class="file-tree-header">
            <span>Files</span>
            <button class="btn btn-sm" id="addFileBtn" style="padding: 4px 8px; font-size: 11px;">+</button>
          </div>
          <div id="fileTreeContent"></div>
        </div>

        <!-- Editor -->
        <div class="editor-pane">
          <div class="editor-tabs" id="editorTabs"></div>
          <div id="monacoEditor"></div>
        </div>

        <!-- Preview -->
        <div class="preview-pane">
          <div class="preview-header">
            <h3>Live Preview</h3>
            <button class="btn btn-sm btn-secondary" id="refreshPreviewBtn">⟳ Refresh</button>
          </div>
          <iframe class="preview-iframe" id="previewIframe"></iframe>
        </div>
      </div>

      <!-- AI Assistant Panel -->
      <div class="bottom-panel" id="aiPanel">
        <div class="panel-header">
          <h3>🤖 AI Assistant</h3>
          <button class="btn btn-sm btn-ghost" id="closeAiBtn">✕</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-wrapper">
          <input type="text" class="chat-input" id="chatInput" placeholder="Ask the AI to help build your game...">
          <button class="btn btn-primary" id="sendChatBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- New Game Modal -->
  <div class="modal-backdrop" id="newGameModal">
    <div class="modal">
      <h2>Create New Game</h2>
      <form id="newGameForm">
        <div class="form-field">
          <label>Game Name</label>
          <input type="text" class="form-input" id="newGameName" placeholder="My Awesome Game" required>
        </div>
        <div class="form-field">
          <label>URL Slug</label>
          <input type="text" class="form-input" id="newGameSlug" placeholder="my-awesome-game" required>
        </div>
        <div class="form-field">
          <label>Choose a Template</label>
          <div class="template-grid" id="templateGrid"></div>
        </div>
        <div style="display: flex; gap: 12px;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Create Game</button>
          <button type="button" class="btn btn-secondary" id="cancelNewGameBtn" style="flex: 1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Monaco Editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script type="module" src="/public/game-editor.js"></script>
</body>
</html>
