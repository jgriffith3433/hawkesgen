# Gen's two SQLite databases, streamed to Cloud Storage (the bucket comes from the environment). Credentials are the
# service's own account (the metadata server). One instance at most writes them: max-instances 1, and across revisions
# the lease in src/cloudlease.ts (a deploy's old instance stops and syncs before the new one restores).
dbs:
  - path: /data/hawkesgen.db
    replicas:
      - type: gcs
        bucket: ${HAWKESGEN_STATE_BUCKET}
        path: db/hawkesgen.db
        sync-interval: 1s
        # A fresh snapshot every 15 min, so a new instance (a deploy) restores one snapshot and at most 15 min of WAL
        # instead of every segment since the last instance started (2026-11-02: 14 s of WAL replay in the handover).
        snapshot-interval: 15m
        retention: 168h
  - path: /data/analytics.db
    replicas:
      - type: gcs
        bucket: ${HAWKESGEN_STATE_BUCKET}
        path: db/analytics.db
        sync-interval: 10s
        retention: 168h
