# Headless Xorg on the NVIDIA driver (display.mjs fills __BUSID__, __W__ and __H__). No monitor is attached: the
# screen is a virtual one (AllowEmptyInitialConfiguration, ConnectedMonitor DFP-0 with a made-up EDID-less mode), so
# games get a real GLX and Vulkan surface on the GPU, and ffmpeg's x11grab reads the frames.
Section "ServerLayout"
    Identifier "layout"
    Screen 0 "screen" 0 0
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
EndSection

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
    Option "PciForceNone" "false"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "gpu"
    Driver "nvidia"
    BusID "__BUSID__"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "ConnectedMonitor" "DFP-0"
    Option "HardDPMS" "false"
EndSection

Section "Screen"
    Identifier "screen"
    Device "gpu"
    DefaultDepth 24
    Option "AllowEmptyInitialConfiguration" "true"
    Option "ModeValidation" "NoMaxPClkCheck, NoEdidMaxPClkCheck, NoMaxSizeCheck, NoHorizSyncCheck, NoVertRefreshCheck, NoVirtualSizeCheck, NoExtendedGpuCapabilitiesCheck, NoTotalSizeCheck, NoDualLinkDVICheck, NoDisplayPortBandwidthCheck, AllowNon3DVisionModes, AllowNonHDMI3DModes, AllowNonEdidModes, NoEdidHDMI2Check, AllowDpInterlaced"
    SubSection "Display"
        Depth 24
        Virtual __W__ __H__
    EndSubSection
EndSection
