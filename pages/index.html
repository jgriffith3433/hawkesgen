<html lang="en">

<title>The Observable Universe</title>
<meta name="description" content="The Universe (10²⁷ m): everything we could ever see · 93 billion light-years across · 13.8 billion years old. Explained simply by an AI narrator, with captions. Flip the page for its opposite: the smallest length. One of nine scales, from the nucleus to the universe.">

.k b{color:#8fc2ff;font-weight:600}

.sub{font:400 clamp(11px,1.3vw,14px)/1.5 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);letter-spacing:.05em;max-width:920px;margin:0 auto}
:root{--acc:#8fc2ff}
body{perspective:2400px;background:#000}
#page{position:fixed;inset:0;transform-origin:50% 50%;will-change:transform;background:#03050b;overflow:hidden}
