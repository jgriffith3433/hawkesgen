<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Observable Universe</title>
<meta name="description" content="The Universe (10²⁷ m): everything we could ever see · 93 billion light-years across · 13.8 billion years old. Explained simply by an AI narrator, with captions. One of nine scales, from the nucleus to the universe.">
<meta name="theme-color" content="#03050b">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>

html,body{margin:0;height:100%;background:#03050b;overflow:hidden;color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;text-align:center;padding:max(14px,env(safe-area-inset-top)) 16px 30px;background:linear-gradient(rgba(3,5,11,.72),rgba(3,5,11,.3) 65%,transparent)}
.k{font:600 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.38em;color:var(--dim);text-transform:uppercase}
.k b{color:var(--acc);font-weight:600}
.name{font-weight:700;font-size:clamp(30px,6.2vw,76px);line-height:1.02;letter-spacing:.06em;text-transform:uppercase;margin:.18em 0 .12em;color:#fff;text-shadow:0 0 28px rgba(110,165,255,.7),0 0 6px rgba(160,200,255,.55),0 2px 14px rgba(0,0,0,.9);animation:rise 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;letter-spacing:.3em;filter:blur(6px)}to{opacity:1;letter-spacing:.06em;filter:blur(0)}}
.sub{font:400 clamp(11px,1.3vw,14px)/1.5 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);letter-spacing:.05em;max-width:920px;margin:0 auto}
#cc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 74px);width:max-content;max-width:min(92vw,820px);text-align:center;pointer-events:none}

#ruler a:before{content:"";position:absolute;left:50%;top:15px;width:9px;height:9px;margin-left:-5px;border-radius:50%;background:#0b1326;box-shadow:0 0 0 1.5px rgba(143,194,255,.75);transition:transform .2s,background .2s}

#ruler a.up{padding-top:0;top:-14px}

#ruler a.me:before{background:#fff;box-shadow:0 0 0 2px var(--acc),0 0 18px 4px rgba(143,194,255,.9);transform:scale(1.35)}

#ruler .cap.l{left:-30px}#ruler .cap.r{right:-30px}
@media (max-width:760px){#ruler a:not(.me) span{display:none}#ruler a:not(.me) b{font-size:9px}#ruler .cap{display:none}#cc{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 70px)}}

.nav:hover i,.nav:focus-visible i{transform:scale(1.12);background:rgba(143,194,255,.25);box-shadow:0 0 0 2px #8fc2ff,0 0 24px rgba(143,194,255,.75)}

.nav.r{right:max(6px,env(safe-area-inset-right))}
.nav b{display:block;color:#8fc2ff;font-weight:600}

@media (prefers-reduced-motion:reduce){.name,#snd{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="k" id="k"></div>
  <h1 class="name" id="name"></h1>
  <div class="sub" id="sub"></div>
</div>
<div id="cc" aria-live="polite"><span id="cap"></span></div>
<div id="snd" role="button" tabindex="0" aria-label="Turn the narration sound on">&#128266; Tap anywhere to hear it explained</div>
<nav id="ruler" aria-label="The nine scales, from the nucleus to the universe"></nav>
<audio id="au" src="./narration.mp3" preload="auto" loop muted autoplay playsinline></audio>
<script>
(function () {
'use strict';
// One of nine pages, one per scale of the world (10^-15 m to 10^27 m). Each draws its scale from the real numbers and
// an AI voice explains it; the captions are cut from the voice's own timing. The ruler at the bottom links the nine.
var D = {"i":8,"scales":[{"exp":-15,"name":"The Nucleus","short":"nucleus","size":"10⁻¹⁵ m","sub":"the heart of an atom · a millionth of a billionth of a meter · uranium-235: 92 protons, 143 neutrons","domain":"doseofdestruction.com"},{"exp":-10,"name":"The Atom","short":"atom","size":"10⁻¹⁰ m","sub":"the building brick of everything · one ten-billionth of a meter · hydrogen's electron clouds, drawn from the real equations","domain":"hawkesgames.com"},{"exp":-5,"name":"The Cell","short":"cell","size":"10⁻⁵ m","sub":"the smallest living thing · a hundredth of a millimeter · you are about 37 trillion of these","domain":"hawkesbiomedical.com"},{"exp":0,"name":"You","short":"you","size":"10⁰ m","sub":"the human scale · about a meter and a bit · 7 × 10²⁷ atoms, 37 trillion cells, 86 billion neurons","domain":"icanbe.ai"},{"exp":7,"name":"The Planet","short":"planet","size":"10⁷ m","sub":"Earth · 12,742 km across · a thin skin of rock and air around a ball of hot stone and metal","domain":"yoobalandgame.com"},{"exp":9,"name":"The Star","short":"star","size":"10⁹ m","sub":"the Sun · 1.39 million km across · a million Earths would fit inside","domain":"imaginelivetv.com"},{"exp":13,"name":"The Solar System","short":"solar system","size":"10¹³ m","sub":"the Sun's neighborhood · 9 billion km across at Neptune · real orbits and real speeds, distances squeezed to fit","domain":"theplacedepartment.com"},{"exp":21,"name":"The Galaxy","short":"galaxy","size":"10²¹ m","sub":"","domain":"phorigins.com"},{"exp":27,"name":"The Universe","short":"universe","size":"10²⁷ m","sub":"everything we could ever see · 93 billion light-years across · 13.8 billion years old","domain":"hawkesgen.ai"}],"cues":[[0,0.95,"Hello."],[0.95,4.53,"I'm the AI that lives in this page, and this is everything."],[4.53,6.37,"Every dot is not a star."],[6.37,10.34,"Every dot is a whole galaxy, with billions of stars inside."],[10.34,13.9,"There are hundreds of billions of galaxies that we could ever see."],[13.9,15.99,"They are not sprinkled evenly."],[15.99,19.86,"They line up in strings and sheets, like a giant spider web,"],[19.86,22.6,"or like the bubbles in a sink full of soap."],[22.6,24.46,"And it is all stretching."],[24.46,27.95,"Picture raisin bread, rising in the oven."],[27.95,31.16,"Every raisin moves away from every other raisin,"],[31.16,34.98,"and the farther apart they are, the faster they separate."],[34.98,37.21,"Galaxies do exactly that."],[37.21,40.74,"The universe started very small and very hot,"],[40.74,45.99,"thirteen point eight billion years ago, and it has been growing ever since."],[45.99,48.52,"The edge you see is not a wall."],[48.52,51.85,"It is just as far as light has had time to travel to us."],[51.85,53.55,"Beyond it, there is more."],[53.55,55.879999999999995,"We just can't see it yet."]],"dur":55.88};
var TAU = Math.PI * 2;
function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gauss(r) { var u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
// a soft glowing dot, drawn from a cached sprite (fast enough for tens of thousands a frame)
var sprites = {};
function sprite(col) {
  if (sprites[col]) return sprites[col];
  var s = document.createElement('canvas'); s.width = s.height = 64; var g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, col); gr.addColorStop(0.25, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.globalAlpha = 1; g.fillRect(0, 0, 64, 64);
  return (sprites[col] = s);
}
function dot(x, c, y, r, col, a) { x.globalAlpha = a == null ? 1 : a; x.drawImage(sprite(col), c - r, y - r, r * 2, r * 2); }
function label(x, text, px, py, align, col, size) {
  x.save(); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.font = '500 ' + (size || 12) + 'px "JetBrains Mono", ui-monospace, monospace'; x.textAlign = align || 'left'; x.textBaseline = 'middle';
  x.lineWidth = 4; x.strokeStyle = 'rgba(3,5,11,.85)'; x.strokeText(text, px, py); x.fillStyle = col || 'rgba(214,228,255,.9)'; x.fillText(text, px, py); x.restore();
}
function lead(x, x0, y0, x1, y1, col) { x.save(); x.globalAlpha = 0.6; x.globalCompositeOperation = 'source-over'; x.strokeStyle = col || 'rgba(143,194,255,.7)'; x.lineWidth = 1; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function scaleBar(x, W, H, px, text) { // a labelled length, bottom-left above the ruler
  var bx = Math.max(22, W * 0.03), by = H - 150; x.save(); x.globalAlpha = 0.9; x.strokeStyle = '#fff'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(bx, by - 5); x.lineTo(bx, by); x.lineTo(bx + px, by); x.lineTo(bx + px, by - 5); x.stroke(); x.restore();

var H3 = { rng: rng, gauss: gauss, clamp: clamp, lerp: lerp, smooth: smooth, dot: dot, label: label, lead: lead, scaleBar: scaleBar, TAU: TAU };

// THE OBSERVABLE UNIVERSE: 93 billion light-years across, every speck a galaxy. The galaxies sit on a cosmic web: the
// walls and threads between empty bubbles (made here by pulling random points onto the faces and edges between the
// nearest of 70 void centres, which is how the real web looks). It grows from the Big Bang with the scale factor of a
// matter-filled universe, a(t) ~ t^(2/3); every pair of galaxies separates at a speed proportional to its distance
// (Hubble's law, v = H0 d, H0 = 70 km/s per megaparsec), so nothing is the centre: "you are here" is just where we
// look from. Light from farther away is stretched redder. The outer shell is the oldest light there is (the CMB).
var SCENE = (function () {
  var r = H3.rng(1380), N = 24000, G = [], shell = [], CYC = 52;
  function init() {
    var seeds = [], i, k; for (i = 0; i < 70; i++) seeds.push([r() * 2.4 - 1.2, r() * 2.4 - 1.2, r() * 2.4 - 1.2]);
    var tries = 0; while (G.length < N && tries++ < N * 6) {
      var p = [r() * 2 - 1, r() * 2 - 1, r() * 2 - 1]; if (p[0] * p[0] + p[1] * p[1] + p[2] * p[2] > 1) continue;
      var d1 = 1e9, d2 = 1e9, d3 = 1e9, s1 = null, s2 = null, s3 = null;
      for (k = 0; k < seeds.length; k++) { var s = seeds[k], d = (p[0] - s[0]) * (p[0] - s[0]) + (p[1] - s[1]) * (p[1] - s[1]) + (p[2] - s[2]) * (p[2] - s[2]); if (d < d1) { d3 = d2; s3 = s2; d2 = d1; s2 = s1; d1 = d; s1 = s; } else if (d < d2) { d3 = d2; s3 = s2; d2 = d; s2 = s; } else if (d < d3) { d3 = d; s3 = s; } }
      p = toward(p, s1, s2, 0.9); if (r() < 0.6) p = toward(p, s1, s3, 0.85); // onto a wall, then often onto a thread
      var l = Math.hypot(p[0], p[1], p[2]); if (l > 1) continue;
      G.push([p[0], p[1], p[2], l, 0.6 + r() * 0.9]);
    }
    for (i = 0; i < 2600; i++) { var y = r() * 2 - 1, rad = Math.sqrt(1 - y * y), a = r() * 6.2832; shell.push([Math.cos(a) * rad, y, Math.sin(a) * rad, r()]); }
  }
  function toward(p, a, b, f) { // move p a fraction f of the way to the plane halfway between a and b
    var nx = b[0] - a[0], ny = b[1] - a[1], nz = b[2] - a[2], l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, mz = (a[2] + b[2]) / 2, d = (p[0] - mx) * nx + (p[1] - my) * ny + (p[2] - mz) * nz;
    return [p[0] - nx * d * f, p[1] - ny * d * f, p[2] - nz * d * f];
  }
  function draw(x, W, H, t, dt, nt) {
    var cx = W / 2, cy = H * 0.47, R = Math.min(W * 0.44, H * 0.33), tc = t % CYC, i;
    x.fillStyle = '#010208'; x.fillRect(0, 0, W, H);
    // the scale factor: a ~ t^(2/3) over the first 20 seconds (13.8 billion years), then held
    var grow = H3.clamp(tc / 20, 0, 1), a = Math.pow(grow, 2 / 3), fade = 1 - H3.smooth((tc - (CYC - 2.5)) / 2.5), age = grow * 13.8;
    var rot = t * 0.05, ca = Math.cos(rot), sa = Math.sin(rot), tl = 0.32, ct = Math.cos(tl), st = Math.sin(tl);
    x.globalCompositeOperation = 'lighter';
    if (tc < 2.2) { var f = 1 - tc / 2.2; H3.dot(x, cx, cy, R * (0.2 + tc * 0.9), 'rgba(255,245,220,1)', f * f); H3.dot(x, cx, cy, R * (0.05 + tc * 0.3), 'rgba(255,255,255,1)', f); }
    // the oldest light: a mottled shell at the edge of what can be seen
    for (i = 0; i < shell.length; i++) { var s = shell[i], x1 = s[0] * ca + s[2] * sa, z1 = -s[0] * sa + s[2] * ca, y1 = s[1] * ct - z1 * st, z2 = s[1] * st + z1 * ct, pr = 1 + z2 * 0.18; H3.dot(x, cx + x1 * R * a * pr, cy - y1 * R * a * pr, 3.2, s[3] > 0.5 ? 'rgba(255,150,70,1)' : 'rgba(90,150,255,1)', 0.09 * fade * (0.5 + 0.5 * a)); }
    // the galaxies; hotter and denser when the universe was small, redder with distance
    var sz = Math.max(1.1, R * 0.0052), hot = 1 - a;
    for (i = 0; i < G.length; i++) { var g = G[i], gx = g[0] * ca + g[2] * sa, gz = -g[0] * sa + g[2] * ca, gy = g[1] * ct - gz * st, gz2 = g[1] * st + gz * ct, p2 = 1 + gz2 * 0.18, d = g[3];
      var col = hot > 0.6 ? 'rgba(255,225,180,1)' : d < 0.33 ? 'rgba(190,215,255,1)' : d < 0.66 ? 'rgba(255,235,200,1)' : 'rgba(255,165,120,1)';
      H3.dot(x, cx + gx * R * a * p2, cy - gy * R * a * p2, sz * g[4] * p2 * (1 + hot * 1.5), col, (0.42 + hot * 0.4) * fade); }
    H3.dot(x, cx, cy, 5, 'rgba(255,255,255,1)', fade);
    x.globalCompositeOperation = 'source-over'; x.globalAlpha = fade;
    x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 1; x.beginPath(); x.arc(cx, cy, 10, 0, 7); x.stroke();
    H3.lead(x, cx + 8, cy - 8, cx + R * 0.42, cy - R * 0.62); H3.label(x, 'you are here (and so is everyone: every spot sees the same thing)', cx + R * 0.44, cy - R * 0.66, W > 760 ? 'left' : 'center', '#fff', 11);
    x.setLineDash([3, 6]); x.strokeStyle = 'rgba(255,190,140,.45)'; x.beginPath(); x.arc(cx, cy, R * a, 0, 7); x.stroke(); x.setLineDash([]);
    if (a > 0.5) H3.label(x, 'the edge of what light has had time to show us', cx, cy + R * a + 14, 'center', 'rgba(255,205,170,.85)', 11);
    H3.label(x, age < 13.75 ? 'age of the universe: ' + age.toFixed(1) + ' billion years' : 'today: 13.8 billion years old', cx, cy - R - 16, 'center', '#fff', 13);
    x.globalAlpha = 1;
    var bx = Math.max(22, W * 0.03); H3.label(x, 'every speck: a galaxy  ·  v = H₀ × d: twice as far, twice as fast', bx, H - 150, 'left', 'rgba(238,244,255,.9)', W < 760 ? 10 : 12);
  }
  return { init: init, draw: draw };
})();


// ---------------------------------------------------------------- page
var cv = document.getElementById('c'), cx = cv.getContext('2d'), W = 0, Hh = 0, dpr = 1;
function fit() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; Hh = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0); if (SCENE.resize) SCENE.resize(W, Hh); }
addEventListener('resize', fit);
var me = D.scales[D.i];
document.getElementById('k').innerHTML = 'Scale ' + (D.i + 1) + ' of ' + D.scales.length + ' · <b>' + me.size + '</b>';
document.getElementById('name').textContent = me.name;
document.getElementById('sub').textContent = me.sub;
var ruler = document.getElementById('ruler'), lo = D.scales[0].exp, hi = D.scales[D.scales.length - 1].exp;
ruler.innerHTML = '<span class="cap l">← smaller</span><span class="cap r">bigger →</span>' + D.scales.map(function (s, i) {
  return '<a href="https://' + s.domain + '/" class="' + (i === D.i ? 'me ' : '') + (i % 2 ? 'up' : '') + '" style="left:' + ((s.exp - lo) / (hi - lo) * 100).toFixed(2) + '%"' + (i === D.i ? ' aria-current="page"' : '') + ' title="' + s.name + ' · ' + s.size + ' · ' + s.domain + '"><b>' + s.size + '</b><span>' + s.short + '</span></a>';
}).join('');

// the arrows at the sides: one scale smaller, one scale bigger (they wrap round at the ends); the arrow keys do the same
(function () { var n = D.scales.length, pv = D.scales[(D.i - 1 + n) % n], nx = D.scales[(D.i + 1) % n];
  function nav(cls, s, arrow, word) { var a = document.createElement('a'); a.className = 'nav ' + cls; a.href = 'https://' + s.domain + '/'; a.title = word + ': ' + s.name + ' (' + s.size + ')'; a.setAttribute('aria-label', word + ': ' + s.name); a.innerHTML = '<i>' + arrow + '</i><span>' + word + '<b>' + s.short + '</b></span>'; document.body.appendChild(a); return a; }
  var L = nav('l', pv, '‹', D.i === 0 ? 'biggest' : 'smaller'), R = nav('r', nx, '›', D.i === n - 1 ? 'smallest' : 'bigger');
  addEventListener('keydown', function (e) { if (e.altKey || e.ctrlKey || e.metaKey) return; if (e.key === 'ArrowLeft') location.href = L.href; else if (e.key === 'ArrowRight') location.href = R.href; });
})();

// the voice: muted until the first tap (browsers require it); the captions and the picture follow its clock either way
var au = document.getElementById('au'), snd = document.getElementById('snd'), cap = document.getElementById('cap'), started = false, t0 = performance.now(), shown = -2;
function nt() { return (!au.paused && au.readyState > 1 && isFinite(au.currentTime)) ? au.currentTime : ((performance.now() - t0) / 1000) % (D.dur + 2); }
function setSnd() { snd.classList.add('on'); snd.innerHTML = au.muted ? '&#128263; Sound off' : '&#128266; Sound on'; snd.setAttribute('aria-label', au.muted ? 'Turn the sound on' : 'Turn the sound off'); }
