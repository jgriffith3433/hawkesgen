# Deploys one of Gen's Cloudflare Workers with wrangler (was: npx wrangler deploy on J's laptop).
# production runs only from main (environment "production" allows main only); beta only from beta. gen-cdn has no beta.
# Needs CLOUDFLARE_API_TOKEN in the environment (Workers Scripts edit + Workers Routes edit) and the CLOUDFLARE_ACCOUNT_ID variable.
#   gh workflow run ops-workers-deploy.yml --repo jgriffith3433/hawkesgen --ref main -f worker=gen-edge -f lane=production
#   gh workflow run ops-workers-deploy.yml --repo jgriffith3433/hawkesgen --ref beta -f worker=gen-edge -f lane=beta
name: ops-workers-deploy
on:
  workflow_dispatch:
    inputs:
      worker:
        type: choice
        options: [gen-edge, gen-cdn]
      lane:
        type: choice
        options: [beta, production]
        default: beta
permissions:
  contents: read
concurrency:
  group: ops-workers-${{ inputs.worker }}-${{ inputs.lane }}
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy a worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.lane }}
    steps:
      - name: Check the inputs
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "${{ inputs.worker }}" = gen-cdn ] && [ "${{ inputs.lane }}" = beta ]; then echo "gen-cdn has no beta lane"; exit 1; fi
          [ "$HAS_TOKEN" = true ] || { echo "CLOUDFLARE_API_TOKEN is not set in the ${{ inputs.lane }} environment"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy
        working-directory: server/${{ inputs.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund
          if [ "${{ inputs.lane }}" = beta ]; then npx wrangler deploy --env beta; else npx wrangler deploy; fi
