# Deploys Gen's Cloudflare Workers with wrangler (was: npx wrangler deploy on J's laptop).
# production runs only from main (environment "production" allows main only); beta only from beta. gen-cdn has no beta.
# Needs CLOUDFLARE_API_TOKEN in the environment (Workers Scripts edit + Workers Routes edit) and the CLOUDFLARE_ACCOUNT_ID variable.
#
# By itself (no manual step):
# - a push to main that changes server/gen-edge/**, server/gen-cdn/** or this file deploys that worker to production
#   (a change to this file deploys both). Going live (Studio fast-forwarding main to beta) is such a push.
# - a push to beta that changes server/gen-edge/** or this file deploys gen-edge's beta lane.
# - beta-automerge's merges don't fire push events (GitHub's rule for its token); it starts this workflow by hand on
#   beta instead (as github-actions[bot]), and then the merge commit's own changes decide, the same way.
# By hand (unchanged):
#   gh workflow run ops-workers-deploy.yml --repo jgriffith3433/hawkesgen --ref main -f worker=gen-edge -f lane=production
#   gh workflow run ops-workers-deploy.yml --repo jgriffith3433/hawkesgen --ref beta -f worker=gen-edge -f lane=beta
name: ops-workers-deploy
on:
  push:
    branches: [main, beta]
    paths:
      - server/gen-edge/**
      - server/gen-cdn/**
      - .github/workflows/ops-workers-deploy.yml
  workflow_dispatch:
    inputs:
      worker:
        type: choice
        options: [gen-edge, gen-cdn]
      lane:
        type: choice
        options: [beta, production]
        default: beta
permissions:
  contents: read
jobs:
  plan:
    name: Which workers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.triggering_actor }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          IN_WORKER: ${{ inputs.worker }}
          IN_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          workers=""
          if [ "$EVENT" = workflow_dispatch ] && [ "$ACTOR" != "github-actions[bot]" ]; then
            # By hand: exactly what was asked, as before.
            if [ "$IN_WORKER" = gen-cdn ] && [ "$IN_LANE" = beta ]; then echo "gen-cdn has no beta lane"; exit 1; fi
            lane="$IN_LANE"; workers="$IN_WORKER"
          else
            case "$BRANCH" in
              main) lane=production; candidates="gen-edge gen-cdn" ;;
              beta) lane=beta; candidates="gen-edge" ;;
              *) echo "pushes deploy only from main or beta"; lane=none; candidates="" ;;
            esac
            # What changed: the push's range, or the merge commit's own changes when beta-automerge started this run.
            base=""
            if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base="$BEFORE"
            elif [ "$EVENT" = workflow_dispatch ] && git rev-parse -q --verify "$SHA^1" >/dev/null; then
              base="$SHA^1"
            fi
            if [ -n "$base" ]; then changed=$(git diff --name-only "$base" "$SHA"); else changed="(unknown: deploy all)"; fi
            echo "changed files:"; echo "$changed" | head -50
            for w in $candidates; do
              if [ -z "$base" ] || echo "$changed" | grep -qE "^(server/$w/|\.github/workflows/ops-workers-deploy\.yml$)"; then
                workers="$workers $w"
              fi
            done
          fi
          matrix=$(python3 -c 'import json,sys; ws=sys.argv[2].split(); print(json.dumps({"include":[{"worker":w,"lane":sys.argv[1]} for w in ws]}))' "$lane" "$workers")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ -n "${workers// /}" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
          echo "deploying: ${workers:-nothing} (lane $lane)"
  deploy:
    name: Deploy ${{ matrix.worker }} (${{ matrix.lane }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment: ${{ matrix.lane }}
    concurrency:
      group: ops-workers-${{ matrix.worker }}-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - name: Check the token
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "${{ matrix.worker }}" = gen-cdn ] && [ "${{ matrix.lane }}" = beta ]; then echo "gen-cdn has no beta lane"; exit 1; fi
          [ "$HAS_TOKEN" = true ] || { echo "CLOUDFLARE_API_TOKEN is not set in the ${{ matrix.lane }} environment"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy
        working-directory: server/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund
          if [ "${{ matrix.lane }}" = beta ]; then npx wrangler deploy --env beta; else npx wrangler deploy; fi
