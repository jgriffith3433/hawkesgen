# Every RunPod endpoint onto Gen's idle rule (tools/gpu-providers/runpod-v2.mjs IDLE_SECONDS): no warm workers (min 0)
# and none idle past 60 s; max workers stay. J, 2026-11-11: "Make sure runpod isn't wasted on builds and playtests if at
# all possible" (no warm idle pods). On 2026-11-11 08:36 UTC the GPU and 3D endpoints kept idle workers 600 s and 900 s.
#
# By itself: on a push to main that changes the RunPod setup (the rule lives in code; this applies it). By hand:
#   gh workflow run ops-runpod-idle.yml --repo jgriffith3433/hawkesgen            (dry: -f apply=false)
# Changes only the endpoints' worker settings; no worker is started and no price changes.
name: ops-runpod-idle
on:
  push:
    branches: [main]
    paths:
      - tools/gpu-providers/runpod-v2.mjs
      - tools/gpu-providers/runpod.mjs
      - .github/workflows/ops-runpod-idle.yml
  workflow_dispatch:
    inputs:
      apply:
        description: 'Change the endpoints (false: only print what would change)'
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: ops-runpod-idle
  cancel-in-progress: false
jobs:
  idle:
    name: RunPod endpoints keep no warm or long-idle workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-gen
          service_account: ops-reader@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: The idle rule on every endpoint
        env:
          APPLY: ${{ github.event_name == 'push' || inputs.apply && 'true' || 'false' }}
        run: |
          key=$(gcloud secrets versions access latest --secret=gen-runpod-api-key --project "${{ vars.GCP_PROJECT }}")
          echo "::add-mask::$key"
          args="--idle"; [ "$APPLY" = "true" ] && args="$args --apply"
          RUNPOD_API_KEY="$key" node tools/gpu-providers/runpod.mjs $args | tee -a "$GITHUB_STEP_SUMMARY"
