# The GPU worker image on GHCR, for RunPod, Modal and any other GPU host (docs/gpu-providers.md, "The image"). Push a tag
# gpu-image-<anything> (or run it by hand) and GitHub builds server/cloudrun with the pinned nodes and pushes
# ghcr.io/jgriffith3433/hawkes-gen-gpu:<comfy tag>-<context hash> and :latest. GitHub's own token writes the package: no
# secret. The image has ComfyUI, its nodes and worker.py only (no models, no keys).
name: GPU image
on:
  push:
    tags: ['gpu-image-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # CUDA PyTorch and the nodes' wheels need more than the runner's free disk.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build folder
        id: ctx
        run: node tools/gpu-providers/image-context.mjs "$RUNNER_TEMP/gpu" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          img=ghcr.io/jgriffith3433/hawkes-gen-gpu
          docker build "$RUNNER_TEMP/gpu" \
            --build-arg COMFY_REPO="${{ steps.ctx.outputs.COMFY_REPO }}" --build-arg COMFY_TAG="${{ steps.ctx.outputs.COMFY_TAG }}" \
            --label org.opencontainers.image.source=https://github.com/jgriffith3433/hawkesgen \
            -t "$img:${{ steps.ctx.outputs.TAG }}" -t "$img:latest"
          docker push "$img:${{ steps.ctx.outputs.TAG }}"
          docker push "$img:latest"
          echo "Pushed $img:${{ steps.ctx.outputs.TAG }}" >> "$GITHUB_STEP_SUMMARY"
