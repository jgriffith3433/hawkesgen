# Read-only: RunPod's serverless endpoints (API v2) and each one's /health (workers, jobs in queue), then what the
# setup scripts' --apply would change (--check: GETs only). The RunPod key is read from
# Secret Manager as ops-reader (keyless) and masked. Gen's WIF provider trusts main and beta only: dispatch with --ref main.
#   gh workflow run ops-gpu-status.yml --repo jgriffith3433/hawkesgen --ref main
name: ops-gpu-status
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ops-gpu-status
  cancel-in-progress: true
jobs:
  status:
    name: GPU providers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-gen
          service_account: ops-reader@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: RunPod
        run: |
          key=$(gcloud secrets versions access latest --secret=gen-runpod-api-key --project "${{ vars.GCP_PROJECT }}")
          echo "::add-mask::$key"
          echo "RUNPOD_API_KEY=$key" >> "$GITHUB_ENV"
          # API v2 (REST v1 retires 2026-11-15, GraphQL early 2027): GET /v2/serverless, RFC 9457 errors.
          eps=$(curl -s --max-time 30 -H "Authorization: Bearer $key" 'https://api.runpod.io/v2/serverless?limit=100')
          echo "$eps" | jq -e '.endpoints' >/dev/null || { echo "RunPod answered: $(echo "$eps" | jq -c '{title, detail} // .' | head -c 300)"; exit 1; }
          { echo "### RunPod endpoints"; echo '| id | name | type | workers min/max | gpu pools | health |'; echo '|---|---|---|---|---|---|'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$eps" | jq -r '.endpoints[] | [.id, .name, (.type // "?"), "\(.workers.min // "?")/\(.workers.max // "?")", ((.gpu.pools // []) | join(","))] | @tsv' | while IFS=$'\t' read -r id name type w pools; do
            h=$(curl -s --max-time 20 -H "Authorization: Bearer $key" "https://api.runpod.ai/v2/$id/health" | jq -c '{jobs, workers}' 2>/dev/null || echo unreachable)
            echo "| $id | $name | $type | $w | $pools | \`$h\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "$id $name $type $w $pools $h"
          done
      - name: RunPod balance and the playtest endpoint's workers
        run: |
          # The balance (GraphQL myself.clientBalance, as Gen's src/providers/gpu/credit.ts reads it): at or below $0
          # RunPod starts no worker and Gen skips RunPod for playtests. Then the playtest endpoint's workers, if API v2
          # lists them. Reads only; prints no key.
          b=$(curl -s --max-time 30 -H "Authorization: Bearer $RUNPOD_API_KEY" -H 'content-type: application/json' \
            -d '{"query":"{ myself { clientBalance currentSpendPerHr } }"}' https://api.runpod.io/graphql)
          echo "balance: $(echo "$b" | jq -c '.data.myself // .errors[0].message // .' | head -c 300)" | tee -a "$GITHUB_STEP_SUMMARY"
          id=$(curl -s --max-time 30 -H "Authorization: Bearer $RUNPOD_API_KEY" 'https://api.runpod.io/v2/serverless?limit=100' | jq -r '.endpoints[] | select(.name == "hawkes-gen-playtest-gfx") | .id' | head -1)
          [ -n "$id" ] || { echo "no endpoint named hawkes-gen-playtest-gfx"; exit 0; }
          for path in "serverless/$id/workers" "serverless/$id?include=workers"; do
            code=$(curl -s -o w.json -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $RUNPOD_API_KEY" "https://api.runpod.io/v2/$path")
            echo "GET /v2/$path: $code"
            [ "$code" = 200 ] && jq -c '(.workers // .data // (if type == "array" then . else [] end))[]? | {id, status: (.status // .desiredStatus), gpu: (.gpuTypeId // .gpu // .machine.gpuTypeId), createdAt, lastStartedAt, lastStatusChange}' w.json | head -20
          done
          rm -f w.json
      - name: RunPod spend by endpoint and pod (last 24 hours, reads only)
        run: |
          # Where the RunPod balance went: RunPod's billing history, hourly, per endpoint and per pod. Reads only; prints no key.
          start=$(date -u -d '-24 hours' +%Y-%m-%dT%H:00:00Z); end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          names=$(curl -s --max-time 30 -H "Authorization: Bearer $RUNPOD_API_KEY" 'https://api.runpod.io/v2/serverless?limit=100' | jq -c '[.endpoints[]? | {key: .id, value: .name}] | from_entries')
          for kind in endpoints pods networkvolumes; do
            code=$(curl -s -o b.json -w '%{http_code}' --max-time 30 -H "Authorization: Bearer $RUNPOD_API_KEY" \
              "https://rest.runpod.io/v1/billing/$kind?bucketSize=hour&startTime=$start&endTime=$end&grouping=$([ $kind = pods ] && echo podId || echo endpointId)")
            echo "### billing/$kind: $code" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$code" = 200 ]; then
              jq -r --argjson n "$names" '(if type == "array" then . else (.data // .records // []) end)[] | select((.amount // 0) > 0) | [.time, (.endpointId // .podId // .networkVolumeId // "?"), ($n[.endpointId // ""] // ""), (.amount|tostring), ((.timeBilledMs // 0)/1000|floor|tostring)+"s"] | @tsv' b.json | tee -a "$GITHUB_STEP_SUMMARY" | head -200
              echo "total: $(jq '[(if type == "array" then . else (.data // .records // []) end)[] | (.amount // 0)] | add' b.json)" | tee -a "$GITHUB_STEP_SUMMARY"
            else head -c 400 b.json; echo; fi
          done
          echo "pods now: $(curl -s --max-time 30 -H "Authorization: Bearer $RUNPOD_API_KEY" https://rest.runpod.io/v1/pods | jq -c '[.[]? | {id, name, desiredStatus, costPerHr}]' | head -c 800)"
          rm -f b.json
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: What the RunPod setup scripts would change (reads only)
        run: |
          set -o pipefail
          node tools/playtest-runpod/setup.mjs --check --name hawkes-gen-playtest-gfx | sed -n '/^# Check against/,/^# Then/p'
          node tools/play-native/setup.mjs --check | sed -n '/^# Check against/,/^# Then/p'
