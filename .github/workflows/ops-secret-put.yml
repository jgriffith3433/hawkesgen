# Adds a new version of one of Gen's Secret Manager secrets from the GitHub secret of the matching name in the
# "production" environment (main only). The value goes to gcloud on stdin; nothing prints it. As ops-secrets, which may
# only add versions to these secrets. Rotating a key: set the new value in GitHub (gh secret set NAME --env production),
# dispatch this, then run Deploy (ci.yml) on each lane so a new revision mounts :latest.
#   gh workflow run ops-secret-put.yml --repo jgriffith3433/hawkesgen --ref main -f secret=gen-anthropic-api-key
name: ops-secret-put
on:
  workflow_dispatch:
    inputs:
      secret:
        type: choice
        options:
          - gen-anthropic-api-key
          - gen-comfy-org-api-key
          - gen-copilot-github-token
          - gen-elevenlabs-api-key
          - gen-gemini-api-key
          - gen-gpu-worker-token
          - gen-modal-proxy-key
          - gen-modal-proxy-secret
          - gen-runpod-api-key
          - gen-xai-api-key
permissions:
  contents: read
  id-token: write
concurrency:
  group: ops-secret-put
  cancel-in-progress: false
jobs:
  put:
    name: Add a secret version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-gen
          service_account: ops-secrets@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Add the version
        env:
          NAME: ${{ inputs.secret }}
          VALUE: ${{ secrets[fromJSON('{"gen-anthropic-api-key":"ANTHROPIC_API_KEY","gen-comfy-org-api-key":"COMFY_ORG_API_KEY","gen-copilot-github-token":"COPILOT_GITHUB_TOKEN","gen-elevenlabs-api-key":"ELEVENLABS_API_KEY","gen-gemini-api-key":"GEMINI_API_KEY","gen-gpu-worker-token":"GPU_WORKER_TOKEN","gen-modal-proxy-key":"MODAL_PROXY_KEY","gen-modal-proxy-secret":"MODAL_PROXY_SECRET","gen-runpod-api-key":"RUNPOD_API_KEY","gen-xai-api-key":"XAI_API_KEY"}')[inputs.secret]] }}
        run: |
          [ -n "$VALUE" ] || { echo "The GitHub secret for $NAME is empty in the production environment"; exit 1; }
          printf '%s' "$VALUE" | gcloud secrets versions add "$NAME" --project "${{ vars.GCP_PROJECT }}" --data-file=- --format='value(name)'
          echo "Added a version to $NAME. Run Deploy on each lane so a new revision mounts it." >> "$GITHUB_STEP_SUMMARY"
