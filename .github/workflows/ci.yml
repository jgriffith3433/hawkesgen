# Typecheck and tests on every pull request and push to main (an agent branch runs once, through its pull request).
# The control server deploys a commit on main only after this passes (hawkesstudio/deploy/hawkes-pull.mjs checks the commit's check runs).
name: CI
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same pull request cancels its older run; runs on main are never cancelled (each one deploys).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Docs-only changes (docs/, *.md) skip the install, typecheck and tests, but the job still reports success: Studio's
      # merge gate and the server's deploy read this check, so it must exist.
      - name: What changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git fetch -q --no-tags --depth=1 origin "$BASE"; then
            files=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '(^docs/|\.md$)'; then code=false; echo "Docs only: skipping typecheck and tests"; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # ffmpeg for the compose tests: a static 8.1 release build from GitHub (pinned: master changes options under us) (Ubuntu's mirror got slow enough on
      # 2026-10-22 to time the job out twice while apt downloaded it).
      - if: steps.changed.outputs.code == 'true'
        run: |
          curl -sSfL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar -xJ -C /tmp
          echo /tmp/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin >> "$GITHUB_PATH"
      - if: steps.changed.outputs.code == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.changed.outputs.code == 'true'
        run: npm run typecheck
      # Offline: tests that need the ComfyUI template cache (.data/comfy-cache) or .venv skip themselves.
      - if: steps.changed.outputs.code == 'true'
        run: npm test

  # On main, once the tests pass: tell the control server to deploy this commit (no polling). Studio checks GitHub's
  # OIDC token (this repo, main) and the server pulls it itself (hawkesstudio/deploy/hawkes-pull.mjs). The server
  # ignores this job when it checks CI, since this job is what starts the check.
  tell-server:
    name: Tell the server
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Tell the control server to deploy this commit
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://studio.hawkesgen.com" | jq -r .value)
          curl -sS --fail-with-body --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $token" https://studio.hawkesgen.com/api/hooks/self-deploy
