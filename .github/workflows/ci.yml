# Deploys Gen to Cloud Run (docs/gen-cloudrun.md, "Deploys"), 2026-10-28: Gen runs on Cloud Run now, not the AWS
# control server. The lanes (J, 2026-10-28: dev -> beta -> main): a push to beta deploys `gen-beta`
# (beta.hawkesgen.ai), a push to main deploys `gen` (hawkesgen.ai); dev deploys nothing.
# No tests here (J, 2026-10-25: "i don't want github running the tests anymore"): run `npm run typecheck` and
# `npm test` before pushing. The safety net is the health check: a new revision that doesn't answer its lane's
# /v1/health is replaced by the one before it.
# Keyless: GitHub's OIDC token is traded for the `gen-deployer` account through Workload Identity Federation, trusted for
# this repo's main and beta only (tools/gen-cloudrun/setup-ci.ps1 sets that up once).
name: Deploy
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
concurrency:
  group: deploy-gen-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  PROJECT: hawkes-staging
  PROJECT_NUMBER: '388576319982'
  REGION: us-east4
jobs:
  deploy:
    name: Build and deploy to Cloud Run
    if: github.ref_name == 'main' || github.ref_name == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    steps:
      - name: The lane
        run: |
          # beta runs in us-central1 (its own 20 vCPUs, J 2026-10-29: hawkesstudio infra/README.md); images stay in $REGION's registry.
          if [ "$GITHUB_REF_NAME" = beta ]; then
            echo "RUN_REGION=us-central1" >> "$GITHUB_ENV"
            echo "SERVICE=gen-beta" >> "$GITHUB_ENV"; echo "HEALTH=https://beta.hawkesgen.ai/v1/health" >> "$GITHUB_ENV"
          else
            echo "RUN_REGION=$REGION" >> "$GITHUB_ENV"
            echo "SERVICE=gen" >> "$GITHUB_ENV"; echo "HEALTH=https://hawkesgen.ai/v1/health" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-gen
          service_account: gen-deployer@${{ env.PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build the image for this commit
        run: node tools/gen-cloudrun/build.mjs --project "$PROJECT" --region "$REGION" --commit "$GITHUB_SHA" --apply
      - name: Deploy it, keeping the previous revision to fall back on
        run: |
          prev=$(gcloud run services describe "$SERVICE" --region "$RUN_REGION" --project "$PROJECT" --format='value(status.latestReadyRevisionName)')
          [ -n "$prev" ] || { echo "No $SERVICE service yet: J runs tools/gen-cloudrun/deploy.ps1 for this lane first"; exit 1; }
          echo "prev=$prev" >> "$GITHUB_ENV"
          tag=$(node -e "console.log(require('./.data/cloudrun/gen-image.json').tag)")
          gcloud run services update "$SERVICE" --image "$tag" --region "$RUN_REGION" --project "$PROJECT" --format=none
      - name: Health check (back to the previous revision if it fails)
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$HEALTH" || true)
            [ "$code" = 200 ] && { echo "healthy"; exit 0; }
            sleep 10
          done
          echo "Not healthy: back to $prev"
          gcloud run services update-traffic "$SERVICE" --to-revisions "$prev=100" --region "$RUN_REGION" --project "$PROJECT" --format=none
          exit 1
