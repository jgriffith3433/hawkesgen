# Typecheck and tests on every push and pull request. The control server deploys a commit on main only after
# this passes (hawkesstudio/deploy/hawkes-pull.mjs checks the commit's check runs).
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Offline: tests that need the ComfyUI template cache (.data/comfy-cache) or .venv skip themselves.
      - run: npm test
