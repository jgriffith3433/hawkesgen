# Deploys main to Cloud Run (docs/gen-cloudrun.md, "Deploys"), 2026-10-28: Gen runs on Cloud Run now, not the AWS
# control server. No tests here (J, 2026-10-25: "i don't want github running the tests anymore"): run `npm run typecheck`
# and `npm test` before pushing main. The safety net is the health check: a new revision that doesn't answer
# https://gen.hawkesgen.ai/v1/health is replaced by the one before it.
# Keyless: GitHub's OIDC token is traded for the `gen-deployer` account through Workload Identity Federation, trusted for
# this repo's main only (tools/gen-cloudrun/setup-ci.ps1 sets that up once).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-gen
  cancel-in-progress: false
permissions:
  contents: read
env:
  PROJECT: hawkes-staging
  PROJECT_NUMBER: '388576319982'
  REGION: us-east4
jobs:
  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-gen
          service_account: gen-deployer@${{ env.PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build the image for this commit
        run: node tools/gen-cloudrun/build.mjs --project "$PROJECT" --region "$REGION" --commit "$GITHUB_SHA" --apply
      - name: Deploy it, keeping the previous revision to fall back on
        run: |
          prev=$(gcloud run services describe gen --region "$REGION" --project "$PROJECT" --format='value(status.latestReadyRevisionName)')
          echo "prev=$prev" >> "$GITHUB_ENV"
          tag=$(node -e "console.log(require('./.data/cloudrun/gen-image.json').tag)")
          gcloud run services update gen --image "$tag" --region "$REGION" --project "$PROJECT" --format=none
      - name: Health check (back to the previous revision if it fails)
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://gen.hawkesgen.ai/v1/health || true)
            [ "$code" = 200 ] && { echo "healthy"; exit 0; }
            sleep 10
          done
          echo "Not healthy: back to $prev"
          gcloud run services update-traffic gen --to-revisions "$prev=100" --region "$REGION" --project "$PROJECT" --format=none
          exit 1
