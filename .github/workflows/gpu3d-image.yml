# The 3D worker image on GHCR, for RunPod, Modal and any other GPU host (docs/3d-animation.md, "The image"). Push a tag
# gpu3d-image-<anything> (or run it by hand) and GitHub builds server/gpu3d (Blender, the rig, motion and mocap venvs,
# worker.py; no ComfyUI, no weights, no keys) and pushes ghcr.io/jgriffith3433/hawkes-gen-3d:3d-<context hash> and
# :latest. GitHub's own token writes the package: no secret. Nothing runs it until an endpoint is pointed at it.
name: 3D worker image
on:
  push:
    tags: ['gpu3d-image-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Five PyTorch venvs and Blender need more than the runner's free disk.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/go
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build folder
        id: ctx
        run: node tools/gpu-providers/image-context-3d.mjs "$RUNNER_TEMP/gpu3d" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          img=ghcr.io/jgriffith3433/hawkes-gen-3d
          docker build "$RUNNER_TEMP/gpu3d" --provenance=false \
            --label org.opencontainers.image.source=https://github.com/jgriffith3433/hawkesgen \
            -t "$img:${{ steps.ctx.outputs.TAG }}" -t "$img:latest"
          docker push "$img:${{ steps.ctx.outputs.TAG }}"
          docker push "$img:latest"
          echo "Pushed $img:${{ steps.ctx.outputs.TAG }}" >> "$GITHUB_STEP_SUMMARY"
