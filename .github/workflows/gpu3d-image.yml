# The 3D worker image on GHCR, for RunPod, Modal and any other GPU host (docs/3d-animation.md, "The image"). Push a tag
# gpu3d-image-<anything> (or run it by hand) and GitHub builds server/gpu3d (Blender, the rig, motion and mocap venvs,
# worker.py; no ComfyUI, no weights, no keys) and pushes ghcr.io/jgriffith3433/hawkes-gen-gpu:3d-<context hash> and
# :3d-latest: the public hawkes-gen-gpu package (a new package starts private, and RunPod's API has no registry credentials),
# 3d- tags beside the ComfyUI ones. GitHub's own token writes it: no secret. Nothing runs it until an endpoint points at it.
name: 3D worker image
on:
  push:
    tags: ['gpu3d-image-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Five PyTorch venvs and Blender need more than the runner's free disk.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/heroku /opt/microsoft /opt/az /usr/lib/jvm
          sudo docker image prune -af
          # The root disk is too small for five PyTorch venvs: Docker's and containerd's stores (Docker keeps image layers
          # in containerd's snapshotter now) move to the runner's big /mnt disk, linked back where they're expected.
          sudo systemctl stop docker docker.socket containerd
          for d in docker containerd; do
            sudo mkdir -p /mnt/$d
            if [ -d /var/lib/$d ] && [ ! -L /var/lib/$d ]; then sudo rsync -a /var/lib/$d/ /mnt/$d/ && sudo rm -rf /var/lib/$d; fi
            sudo ln -sfn /mnt/$d /var/lib/$d
          done
          sudo systemctl start containerd docker
          docker info --format 'docker data: {{.DockerRootDir}} storage: {{.Driver}}'
          sudo mkdir -p /mnt/gpu3d-ctx && sudo chown "$(id -u):$(id -g)" /mnt/gpu3d-ctx
          df -h / /mnt
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build folder
        id: ctx
        run: node tools/gpu-providers/image-context-3d.mjs /mnt/gpu3d-ctx >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          img=ghcr.io/jgriffith3433/hawkes-gen-gpu
          docker build /mnt/gpu3d-ctx --provenance=false \
            --label org.opencontainers.image.source=https://github.com/jgriffith3433/hawkesgen \
            -t "$img:${{ steps.ctx.outputs.TAG }}" -t "$img:3d-latest"
          docker push "$img:${{ steps.ctx.outputs.TAG }}"
          docker push "$img:3d-latest"
          echo "Pushed $img:${{ steps.ctx.outputs.TAG }}" >> "$GITHUB_STEP_SUMMARY"
